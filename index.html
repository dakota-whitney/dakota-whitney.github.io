<!DOCTYPE html>
<html>
    <head>
        <title>Dakota's Projects</title>

        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <!-- AdminLTE 4 + Bootstrap 5.3 (CSS) -->
        <link 
            rel="stylesheet" 
            href="css/bootstrap-icons-1.13.1.min.css" 
        />

        <link 
            rel="stylesheet" 
            href="css/overlayscrollbars-2.11.0.min.css" 
        />

        <link 
            rel="stylesheet" 
            href="css/adminlte-4.0.0.min.css" 
        />

        <!--Global CSS-->
        <link
            rel="stylesheet" 
            href="css/styles.css"
        />
    </head>
    <body class="layout-fixed sidebar-expand-lg bg-body-tertiary">

        <!--Bootstrap spinner-->
        <div 
            class="spinner-border position-absolute z-1 top-50 start-50 d-none" 
            style="width: 3rem; height: 3rem;"
            role="status"
        >
            <span class="visually-hidden">Loading...</span>
        </div>

        <div class="app-wrapper">

            <!-- Header -->
            <nav class="app-header navbar navbar-expand bg-body">
                <div class="container-fluid">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link" data-lte-toggle="sidebar" href="#" role="button">
                                <i class="bi bi-list"></i>
                            </a>
                        </li>
                    </ul>
                </div>
            </nav>

            <!-- Sidebar -->
            <aside class="app-sidebar shadow" data-bs-theme="dark">
                <div class="sidebar-brand">
                    <a href="#" class="brand-link">
                        <span class="brand-text fw-light">Dakota's Projects</span>
                    </a>
                </div>
                <div class="sidebar-wrapper">
                    <nav class="mt-2">
                        <ul class="nav sidebar-menu flex-column" data-lte-toggle="treeview" role="menu">
                        </ul>
                    </nav>
                </div>
            </aside>

            <!-- Main content -->
            <main class="app-main">
                <div class="app-content-header">

                    <!--Repository failure alert-->
                    <div class="alert alert-warning d-none" role="alert">
                        Failed to load repositories. Please try again later.
                    </div>
                    
                </div>
                <div class="app-content">
                    <div id="repo" class="container-fluid vh-100"></div>
                </div>

                <div class="app-footer">
                    Page created with <a href="https://adminlte.io/" target="_blank">AdminLTE</a>
                </div>
            </main>

        </div>
        
        <!-- Bootstrap + Popper + AdminLTE (JS) -->
        <script src="js/bootstrap-5.3.8.bundle.min.js"></script>
        <script src="js/overlayscrollbars-2.11.0.browser.es6.min.js"></script>
        <script src="js/adminlte-4.0.0.min.js"></script>

        <!-- DOMPurify -->
        <script src="js/dompurify-3.4.1.min.js"></script>

        <!-- Initialization script -->
         <script src="./repos.js" type="module"></script>
    </body>
</html>
